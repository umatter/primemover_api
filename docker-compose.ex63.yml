# ex63 edge integration -- OPT-IN overlay, NOT auto-loaded.
#
# The base docker-compose.yml (and the auto-loaded docker-compose.override.yml)
# stay portable for local dev and CI: they know nothing about traefik or the
# shared edge network. This file joins the API to the shared `ex63_internal`
# network. TWO containers need it, for opposite reasons:
#
#   apache -- so traefik can reach IN, serving the same-origin /api route below
#   php    -- so the s3runner disk can reach OUT, to the MinIO holding job data
#
# and declares a SAME-ORIGIN route:
#
#     https://primemover.${DOMAIN}/api   -> this API (apache:80)
#     https://primemover.${DOMAIN}/      -> the GUI    (ex63-infra apps.yml)
#
# The GUI's production bundle calls `/api/v1` on its own origin, so with this in
# place its API_ENDPOINT is left unset -- no second hostname, no CORS.
#
# Use on ex63 ONLY, and explicitly (it is not part of the default up):
#
#     docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.override.yml \
#       -f docker-compose.ex63.yml \
#       up -d apache php
#
# Requires DOMAIN in .env (e.g. `DOMAIN=qamelab.org`) and the `ex63_internal`
# network to already exist (the ex63-infra edge stack creates it).
#
# This does NOT change the 127.0.0.1:8090 host binding or the mysql/redis
# hardening: traefik reaches apache over the internal docker network, never a
# published port. The `tailnet-only@file` middleware keeps it reachable from the
# tailnet only, exactly like the GUI and operator routers.
services:
  apache:
    networks:
      - primemover-network
      - ex63_internal
    labels:
      traefik.enable: "true"
      # apache is on two networks; tell traefik which one to dial so it does not
      # pick the primemover-network address the edge cannot route to.
      traefik.docker.network: ex63_internal
      # Same-origin: only /api reaches the API. A router's default priority is
      # its rule LENGTH, so the GUI's Host-only rule already scores ~30; any
      # explicit value here must beat that, not merely be non-zero. "20" was
      # tried first and silently routed /api to the GUI.
      traefik.http.routers.pm-api.rule: Host(`primemover.${DOMAIN}`) && PathPrefix(`/api`)
      traefik.http.routers.pm-api.priority: "100"
      traefik.http.routers.pm-api.tls.certresolver: letsencrypt
      traefik.http.routers.pm-api.middlewares: tailnet-only@file
      traefik.http.services.pm-api.loadbalancer.server.port: "80"

  # php makes the OUTBOUND connection: the `s3runner` disk reads the runner's
  # job data (HARs, page sources, lambda payloads) out of the local MinIO, which
  # is an ex63_internal service. The public hostname is not an alternative --
  # s3.qamelab.org answers 403 from a docker bridge address, because the edge
  # allow-list sees a bridge IP rather than a tailnet one. So the disk is
  # configured for http://minio:9000, which only resolves on this network.
  #
  # Without this block the attachment has to be made by hand
  # (`docker network connect ex63_internal primemover-php8.1`) and a later
  # `compose up -d` silently drops it again. Nothing errors when it is missing:
  # GET /jobs/{id}/decision, GET /file/{report} and decisions:backfill simply
  # stop being able to reach ~71,800 stored objects. No traefik labels here --
  # php is dialled by apache over primemover-network, never from the edge.
  php:
    networks:
      - primemover-network
      - ex63_internal

networks:
  ex63_internal:
    external: true
