name: Laravel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
    - uses: actions/checkout@v7
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Copy public key
      run: php -r "file_exists('storage/oauth-public.key') || copy('docker/oauth-public.key', 'storage/oauth-public.key');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: vendor/bin/phpunit
    # `composer lint` used to run Pint in WRITE mode, so this step could never
    # fail: it rewrote ~100 source files on every run and exited 0 whatever it
    # found. `lint` now checks (--test) and `format` writes; the two are no
    # longer the same command.
    #
    # Checks the whole tree. This was --diff for one day, because a full check
    # would have failed on 96 pre-existing violations; those were landed as a
    # standalone reformat, so the concession is no longer needed. Full is the
    # right check: with --diff, a direct push to master produced an empty diff
    # and pint passed trivially.
    - name: Check code style (Laravel Pint)
      run: vendor/bin/pint --test
