name: Laravel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
    - uses: actions/checkout@v7
      with:
        # Pint's --diff needs the base branch to compare against.
        fetch-depth: 0
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Copy public key
      run: php -r "file_exists('storage/oauth-public.key') || copy('docker/oauth-public.key', 'storage/oauth-public.key');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: vendor/bin/phpunit
    # `composer lint` used to run Pint in WRITE mode, so this step could never
    # fail: it rewrote ~100 source files on every run and exited 0 whatever it
    # found. `lint` now checks (--test) and `format` writes; the two are no
    # longer the same command.
    #
    # CI checks only what the change touched. A full-tree `composer lint` still
    # reports 96 pre-existing style issues across app/, database/, config/ and
    # tests/, and gating on those would mean landing a ~100-file reformat before
    # any of this could be enforced. --diff enforces it from here forward.
    - name: Check code style (Laravel Pint)
      run: vendor/bin/pint --test --diff=origin/${{ github.base_ref || github.event.repository.default_branch }}
