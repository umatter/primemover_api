version: '3.8'

services:
  apache:
    build:
      context: "./docker/httpd"
    container_name: '${COMPOSE_PROJECT_NAME:-primemover}-apache'
    ports:
      - "127.0.0.1:${HOST_MACHINE_UNSECURE_HOST_PORT:-8080}:80"
      - "127.0.0.1:${HOST_MACHINE_SECURE_HOST_PORT:-8443}:443"
    volumes:
      - ${DOCUMENT_ROOT:-.}:/var/www/html:cached
    environment:
      PMA_PORT: ${HOST_MACHINE_PMA_PORT:-8080}
      XDEBUG_COOKIE_VALUE: ${XDEBUG_COOKIE_VALUE:-PHPSTORM}
    restart: unless-stopped
    depends_on:
      - mysql
      - php
      - redis
    networks:
      - primemover-network

  php:
    build:
      context: ./docker/${PHPVERSION:-php8.1}-fpm
    container_name: '${COMPOSE_PROJECT_NAME:-primemover}-${PHPVERSION:-php8.1}'
    volumes:
      - ${DOCUMENT_ROOT:-.}:/var/www/html:cached
      - ${PHP_INI:-./docker/php/php.ini}:/usr/local/etc/php/php.ini
      # Mount one custom INI file instead of overshadowing the whole conf.d dir
      # - ./docker/${PHPVERSION}-fpm/etc/php/conf.d/custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
    # unless-stopped (was on-failure): php-fpm occasionally exits cleanly (code 0,
    # "exiting, bye-bye") which on-failure does NOT restart, leaving Apache up but
    # every DB request 500ing with "DNS lookup failure for: php". Match the rest
    # of the stack so PHP self-heals.
    restart: unless-stopped
    #command: bash /var/www/docker/laravel/supervisor.sh
    tty: true
    depends_on:
      - mysql
      - redis
    networks:
      - primemover-network

  mysql:
    image: mysql:8.0.25
    container_name: '${COMPOSE_PROJECT_NAME:-primemover}-mysql'
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT:-3307}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./storage/app/data/mysql}:/var/lib/mysql
      - ${MYSQL_LOG_DIR:-./storage/logs/mysql}:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_DATABASE: '${DB_DATABASE:-primemover}'
      MYSQL_USER: '${DB_USERNAME:-primemover}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
    networks:
      - primemover-network

  memcached:
    container_name: '${COMPOSE_PROJECT_NAME:-primemover}-memcached'
    image: memcached:latest
    restart: unless-stopped
    networks:
      - primemover-network

  redis:
    container_name: '${COMPOSE_PROJECT_NAME:-primemover}-redis'
    image: redis:alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - ./storage/app/data/redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-8889}:6379"
    restart: unless-stopped
    networks:
      - primemover-network

  mcp-server:
    build:
      context: .
      dockerfile: ./mcp_server/Dockerfile
    container_name: '${COMPOSE_PROJECT_NAME:-primemover}-mcp'
    volumes:
      # Mount documentation and examples as read-only
      - ./storage/api-docs:/app/storage/api-docs:ro
      - ./examples:/app/examples:ro
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./CLAUDE.md:/app/CLAUDE.md:ro
    environment:
      PM_API_EMAIL: ${PM_API_EMAIL:-admin@primemover.example}
      PM_API_PASSWORD: ${PM_API_PASSWORD:-password}
      PM_API_BASE_URL: ${PM_API_BASE_URL:-http://apache:80/api/v1}
    depends_on:
      - apache
    networks:
      - primemover-network
    # Use profiles so this service doesn't start by default
    # Start with: docker-compose --profile mcp up -d
    profiles:
      - mcp
    stdin_open: true
    tty: true

networks:
  primemover-network:
    driver: bridge
